name: Deploy to GitHub Pages

# Builds the standalone single-file site and publishes it as a Pages artifact,
# so the published page never drifts from the knowledge base.
#
# ONE-TIME SETTING: Settings -> Pages -> Source must be "GitHub Actions".
# ("Deploy from a branch" will keep serving the old gh-pages content instead.)
#
# Deploying also only works from the DEFAULT BRANCH. GitHub creates the
# github-pages environment with a deployment branch policy limited to it, and a
# job targeting that environment from any other branch is refused before a
# runner is allocated - it fails in seconds with no steps and no logs, which
# looks like a broken workflow rather than a policy decision. The deploy job
# below is therefore gated on the default branch, so pushes to a working branch
# still build and test without producing a misleading failed deploy.
#
# The artifact route matters once GROQ_API_KEY is set. Committing the built page
# to a branch put the key into git history, and GitHub's push protection
# correctly refused the push. An artifact is served to browsers without ever
# being committed, so the key is exposed exactly as far as the site is, and no
# further - and it can be rotated by changing one secret.

on:
  push:
    branches:
      - main
      - claude/nsw-procurement-webtool-m48v59
    paths:
      - 'data/kb/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runs before the build: `pretest` regenerates the bundle without a key,
      # so building first would have the AI build silently overwritten.
      - name: Test
        run: npm test

      # GROQ_API_KEY is optional. With the repository secret set, the key is
      # embedded in the published page so the static site can answer with AI,
      # and is readable by anyone who opens it. Without it the site builds
      # knowledge-base-only and needs no key at all.
      - name: Build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          set -euo pipefail
          if [ -n "${GROQ_API_KEY:-}" ]; then
            echo "Building with AI answering enabled."
            node scripts/build-standalone.mjs --embed-key
          else
            echo "No GROQ_API_KEY secret set; building knowledge-base-only."
            node scripts/build-standalone.mjs
          fi

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/procurement-navigator.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # The github-pages environment only accepts deployments from the default
    # branch, so do not attempt one from anywhere else.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
