name: Deploy to GitHub Pages

# Rebuilds the standalone single-file site and publishes it to the gh-pages
# branch, so the published site never drifts from the knowledge base.
#
# Requires GitHub Pages to be enabled once, by hand:
#   Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root)

on:
  push:
    branches:
      - main
      - claude/nsw-procurement-webtool-m48v59
    paths:
      - 'data/kb/**'
      - 'public/**'
      - 'server/retrieval.js'
      - 'server/compose.js'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs before the build: `pretest` regenerates the bundle without a key,
      # so building first would have the AI build silently overwritten.
      - name: Test
        run: npm test

      # Validates the knowledge base, then bundles it into one HTML file.
      # A broken reference fails the build rather than shipping a broken site.
      #
      # GROQ_API_KEY is optional. When the repository secret is set, the key is
      # embedded in the published page so the static site can answer with AI.
      # It is readable by anyone who opens the page - that is inherent to static
      # hosting, and the reason the site works without it too.
      - name: Build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          if [ -n "${GROQ_API_KEY:-}" ]; then
            echo "Building with AI answering enabled."
            node scripts/build-standalone.mjs --embed-key
          else
            echo "No GROQ_API_KEY secret set; building knowledge-base-only."
            node scripts/build-standalone.mjs
          fi

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/procurement-navigator.html out/index.html
          touch out/.nojekyll

          # Skip the deploy when the published page is byte-identical.
          if git fetch origin gh-pages --depth=1 2>/dev/null \
             && git cat-file -e origin/gh-pages:index.html 2>/dev/null; then
            git show origin/gh-pages:index.html > out/published.html
            if cmp -s out/index.html out/published.html; then
              echo "Site unchanged, nothing to publish."
              exit 0
            fi
            rm out/published.html
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Orphan branch so gh-pages holds the built site only - no source tree,
          # no accumulating history. `git add -A <pathspec>` would not stage the
          # deletions below, which is how the source tree leaked in once.
          git checkout --orphan gh-pages-build
          git rm -rf --cached . --quiet
          find . -maxdepth 1 -mindepth 1 \
            ! -name .git ! -name out ! -name node_modules -exec rm -rf {} +
          mv out/index.html out/.nojekyll .
          rmdir out

          git add index.html .nojekyll
          git commit --quiet -m "Rebuild site from ${GITHUB_SHA::7}"
          git push --force origin gh-pages-build:gh-pages
